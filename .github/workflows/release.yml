name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        # Без dotnet-version: версия берётся из global.json (точный пин SDK для
        # воспроизводимости lock-файлов) — детерминированно и синхронно с локальной разработкой.

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Restore
        # CI=true на restore, чтобы Microsoft.SourceLink.GitHub (добавляется только при
        # ContinuousIntegrationBuild=true) попал в restore graph: иначе build --no-restore
        # падает на свежем runner (NU1101).
        run: dotnet restore AvtoBus.slnx /p:ContinuousIntegrationBuild=true --locked-mode

      - name: Build
        run: dotnet build AvtoBus.slnx -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test AvtoBus.slnx -c Release --no-build

      - name: Pack libraries + CLI tool
        # E-06: пакуем slnx целиком (src/* + Cli) — новый пакет подхватится автоматически.
        # Тесты/семплы/бенчмарки исключены через IsPackable=false в Directory.Build.props.
        run: >
          dotnet pack AvtoBus.slnx -c Release --no-build
          /p:Version=${{ env.VERSION }} /p:ContinuousIntegrationBuild=true -o ./artifacts

      - name: Generate SBOM (anchore/sbom-action, idea 479)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./artifacts
          format: spdx-json
          output-file: ./artifacts/sbom.spdx.json

      - name: Push to NuGet (OIDC trusted publishing preferred, fallback to API key)
        run: |
          if [ -n "${{ secrets.NUGET_API_KEY }}" ]; then
            dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "NUGET_API_KEY not set — NuGet Trusted Publishing via OIDC (id-token:write) required; skipping push (dry-run ok)"
          fi
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}

      - name: Push symbols (snupkg)
        run: |
          if [ -n "${{ secrets.NUGET_API_KEY }}" ]; then
            dotnet nuget push ./artifacts/*.snupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "skip snupkg push — no API key, use OIDC"
          fi
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
          body_path: CHANGELOG.md