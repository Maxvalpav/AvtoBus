name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Restore
        # CI=true на restore, чтобы Microsoft.SourceLink.GitHub (добавляется только при
        # ContinuousIntegrationBuild=true) попал в restore graph: иначе build --no-restore
        # падает на свежем runner (NU1101).
        run: dotnet restore AvtoBus.slnx /p:ContinuousIntegrationBuild=true

      - name: Build
        run: dotnet build AvtoBus.slnx -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test AvtoBus.slnx -c Release --no-build

      - name: Pack libraries
        # dotnet pack принимает ровно один проект за вызов (MSB1008 на этой версии SDK),
        # поэтому перебираем проекты циклом.
        run: |
          for proj in \
            src/AvtoBus.Abstractions \
            src/AvtoBus.Core \
            src/AvtoBus.InMemory \
            src/AvtoBus.RabbitMq \
            src/AvtoBus.Sql \
            src/AvtoBus.Kafka \
            src/AvtoBus.Nats \
            src/AvtoBus.Redis \
            src/AvtoBus.AzureServiceBus \
            src/AvtoBus.Outbox.EfCore \
            src/AvtoBus.Sagas \
            src/AvtoBus.EventSourcing \
            src/AvtoBus.Scheduling \
            src/AvtoBus.Security \
            src/AvtoBus.Multitenancy \
            src/AvtoBus.Dashboard \
            src/AvtoBus.AsyncApi \
            src/AvtoBus.EventCatalog \
            src/AvtoBus.Generators \
            src/AvtoBus.Analyzers \
            src/AvtoBus.Testing \
            src/AvtoBus.Aspire \
            src/AvtoBus.Templates \
            src/AvtoBus.Bridge \
            src/AvtoBus.Durability.PostgreSql \
            src/AvtoBus.SchemaRegistry \
            src/AvtoBus.Streams \
            src/AvtoBus.Workflow \
            src/AvtoBus.Serialization.MessagePack \
            src/AvtoBus.Serialization.Protobuf \
            src/AvtoBus ; do
            dotnet pack "$proj" -c Release --no-build /p:Version=${{ env.VERSION }} /p:ContinuousIntegrationBuild=true -o ./artifacts
          done

      - name: Pack CLI tool
        run: >
          dotnet pack src/AvtoBus.Cli -c Release --no-build
          /p:Version=${{ env.VERSION }} /p:ContinuousIntegrationBuild=true -o ./artifacts

      - name: Generate SBOM (Syft, idea 479)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /tmp
          /tmp/syft ./artifacts -o spdx-json=./artifacts/sbom.spdx.json
          ls -lh ./artifacts/sbom.spdx.json

      - name: Push to NuGet (OIDC trusted publishing preferred, fallback to API key)
        run: |
          if [ -n "${{ secrets.NUGET_API_KEY }}" ]; then
            dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "NUGET_API_KEY not set — NuGet Trusted Publishing via OIDC (id-token:write) required; skipping push (dry-run ok)"
          fi
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}

      - name: Push symbols (snupkg)
        run: |
          if [ -n "${{ secrets.NUGET_API_KEY }}" ]; then
            dotnet nuget push ./artifacts/*.snupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "skip snupkg push — no API key, use OIDC"
          fi
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
          body_path: CHANGELOG.md