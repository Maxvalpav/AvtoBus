name: CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Least privilege: job'ам сверх этого не выдаём ничего.
permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        # Без dotnet-version: версия берётся из global.json — детерминированно и синхронно с локальной разработкой.

      - name: Restore
        run: dotnet restore AvtoBus.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format AvtoBus.slnx --verify-no-changes --no-restore

  unit-matrix:
    # E-12: быстрые unit-сьюты без брокеров — на трёх ОС (включая Windows для CLI-путей).
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        # Без dotnet-version: версия берётся из global.json — детерминированно и синхронно с локальной разработкой.

      - name: Restore
        run: dotnet restore AvtoBus.slnx --locked-mode

      - name: Build
        run: dotnet build AvtoBus.slnx -c Release --no-restore

      - name: Test Generators
        run: dotnet test tests/AvtoBus.GeneratorTests -c Release --no-build

      - name: Test Analyzers
        run: dotnet test tests/AvtoBus.AnalyzerTests -c Release --no-build

      - name: Test AsyncApi
        run: dotnet test tests/AvtoBus.AsyncApiTests -c Release --no-build

      - name: Test EventCatalog
        run: dotnet test tests/AvtoBus.EventCatalogTests -c Release --no-build

      - name: Test CLI
        run: dotnet test tests/AvtoBus.CliTests -c Release --no-build

      - name: Test Dashboard
        run: dotnet test tests/AvtoBus.DashboardTests -c Release --no-build

      - name: Test Aspire
        run: dotnet test tests/AvtoBus.AspireTests -c Release --no-build

  build:
    name: Build & Tests
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports: ["5672:5672"]
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: avtobus
          POSTGRES_PASSWORD: avtobus
          POSTGRES_DB: avtobus
        options: >-
          --health-cmd "pg_isready -U avtobus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Включают transport conformance (RabbitMQ, SQL) и интеграционные Outbox/Inbox-тесты.
      AVTOBUS_RABBIT_URL: amqp://guest:guest@localhost:5672/
      AVTOBUS_PG_URL: Host=localhost;Port=5432;Database=avtobus;Username=avtobus;Password=avtobus
      # Секрет прокидывается в env, чтобы его можно было проверить в if:.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        # Без dotnet-version: версия берётся из global.json — детерминированно и синхронно с локальной разработкой.

      - name: Restore
        run: dotnet restore AvtoBus.slnx --locked-mode

      - name: Build
        run: dotnet build AvtoBus.slnx -c Release --no-restore

      - name: Vulnerable packages gate
        # NuGetAudit в Directory.Build.props — основные ворота (падает на сборке).
        # Этот шаг — отчёт + явный fail, т.к. `dotnet list --vulnerable` сам возвращает 0 (аудит D1).
        run: |
          out=$(dotnet list AvtoBus.slnx package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -qi "has known vulnerabilities"; then
            echo "::error::Найдены уязвимые пакеты (см. вывод выше)"
            exit 1
          fi

      - name: Unit & integration tests
        run: >
          dotnet test AvtoBus.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Pack validation (release pipeline smoke)
        run: |
          mkdir -p ./artifacts-verify
          # E-06: пакуем slnx целиком — новый пакет в src/ подхватится автоматически.
          # Тесты/семплы/бенчмарки исключены через IsPackable=false в Directory.Build.props.
          dotnet pack AvtoBus.slnx -c Release --no-build --no-restore \
            /p:Version=0.1.0-verify -o ./artifacts-verify
          count=$(ls ./artifacts-verify/*.nupkg | wc -l)
          echo "Packed $count packages"
          # Аудит D7: без хардкода точного числа — новый пакет не должен ломать CI.
          test "$count" -ge 32

      - name: SBOM (anchore/sbom-action, idea 479)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./artifacts-verify
          format: spdx-json
          output-file: ./artifacts-verify/sbom.spdx.json

      - name: Check SBOM exists
        run: ls -lh ./artifacts-verify/sbom.spdx.json

      - name: Upload nupkgs + SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkgs-verify
          path: ./artifacts-verify/*
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: true

  logistics-sample:
    name: Logistics sample (30 microservices, InMemory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        # Без dotnet-version: версия берётся из global.json — детерминированно и синхронно с локальной разработкой.

      - name: Restore
        run: dotnet restore samples/AvtoBus.Logistics/AvtoBus.Logistics.slnx --locked-mode

      - name: Build
        run: dotnet build samples/AvtoBus.Logistics/AvtoBus.Logistics.slnx -c Release --no-restore

      - name: Smoke run (runner drives all 30 services, exit 0 only if checks pass)
        run: |
          # Runner сам проверяет сценарии (30 сервисов, доставка с ретрая, возврат,
          # операционка, event-driven подписки) и возвращает ненулевой код при провале.
          # Ввод не требуется — завершается сам.
          dotnet run --project samples/AvtoBus.Logistics/runner/AvtoBus.Logistics.Runner -c Release --no-build
          echo "runner exit code: $?"

  aot:
    name: Native AOT (Core + InMemory + RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports: ["5672:5672"]
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AVTOBUS_RABBIT_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        # Без dotnet-version: версия берётся из global.json — детерминированно и синхронно с локальной разработкой.

      - name: Restore
        run: dotnet restore AvtoBus.slnx --locked-mode

      - name: Publish AOT sample (InMemory)
        run: |
          dotnet publish samples/AvtoBus.AotSample -c Release -r linux-x64 \
            /p:SuppressTrimAnalysisWarnings=false

      - name: Smoke run (InMemory)
        run: |
          samples/AvtoBus.AotSample/bin/Release/net10.0/linux-x64/publish/AvtoBus.AotSample

      - name: Publish AOT sample (RabbitMQ)
        run: |
          dotnet publish samples/AvtoBus.AotSample.RabbitMq -c Release -r linux-x64 \
            /p:SuppressTrimAnalysisWarnings=false

      - name: Smoke run (RabbitMQ)
        run: |
          samples/AvtoBus.AotSample.RabbitMq/bin/Release/net10.0/linux-x64/publish/AvtoBus.AotSample.RabbitMq

  conformance-external:
    name: Transport conformance (Kafka / NATS / Redis)
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.8.0
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: controller,broker
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/9092'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      nats:
        image: nats:2-alpine
        command: -js -m 8222
        ports: ["4222:4222"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8222/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Включают transport conformance для Kafka/NATS/Redis (иначе — Assert.Skip).
      AVTOBUS_KAFKA_BOOTSTRAP: localhost:9092
      AVTOBUS_NATS_URL: nats://localhost:4222
      AVTOBUS_REDIS_URL: localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        # Без dotnet-version: версия берётся из global.json — детерминированно и синхронно с локальной разработкой.

      - name: Restore
        run: dotnet restore AvtoBus.slnx --locked-mode

      - name: Build
        run: dotnet build AvtoBus.slnx -c Release --no-restore

      - name: Transport conformance (Kafka/NATS/Redis)
        run: >
          dotnet test tests/AvtoBus.Tests -c Release --no-build
          --filter "FullyQualifiedName~TransportConformance"
          --logger "trx;LogFileName=conformance-external.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-external-results
          path: '**/TestResults/*.trx'
          retention-days: 30

  benchmarks:
    name: Benchmarks (dev baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        # Без dotnet-version: версия берётся из global.json — детерминированно и синхронно с локальной разработкой.

      - name: Run core benchmark
        run: dotnet run -c Release --project benchmarks/AvtoBus.Benchmarks --filter *PublishLatencyBench* --job short

      - name: Upload raw artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/
          retention-days: 30

  docs:
    name: Docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
