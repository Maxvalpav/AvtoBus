replicaCount: 2
image:
  repository: ghcr.io/avtobus/avtobus-worker
  tag: "0.1.0"
  pullPolicy: IfNotPresent
transport: rabbitmq  # inmemory|rabbitmq|kafka|redis|nats|sql|asb
env:
  DOTNET_ENVIRONMENT: Production
secrets:
  # существующий Secret с AVTOBUS_* , RABBITMQ_*, POSTGRES_* …
  name: avtobus-secrets
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }
probes:
  liveness: { path: /healthz, port: 8080 }
  readiness: { path: /readyz, port: 8080 }
  startup: { path: /startupz, port: 8080 }
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 20
  triggers:
    - type: rabbitmq
      metadata: { queueName: orders.place-order, mode: QueueLength, value: "50" }
